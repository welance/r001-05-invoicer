name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install project with dev deps
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: .venv/bin/ruff check src/invoicer tests

      - name: Run unit tests
        run: .venv/bin/pytest tests/unit -v

      - name: CLI smoke test
        run: |
          .venv/bin/python -c "import invoicer.cli; print('import OK')"
          .venv/bin/invoicer --help
          .venv/bin/invoicer --version
          .venv/bin/invoicer init --help
          .venv/bin/invoicer update --help
          .venv/bin/invoicer discover --help
          .venv/bin/invoicer client add --help
          .venv/bin/invoicer defaults --help
          .venv/bin/invoicer defaults set --help
          .venv/bin/invoicer defaults unset --help
          .venv/bin/invoicer draft --help
          .venv/bin/invoicer finalize --help
          .venv/bin/invoicer mail-draft --help
          .venv/bin/invoicer help --help
          .venv/bin/invoicer help multi-org
