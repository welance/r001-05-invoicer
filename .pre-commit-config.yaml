# See https://pre-commit.com for usage
# Install once:  uv pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Guard against committing real secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Run the unit tests on commit. Fast (<1s), no network.
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit tests only)
        entry: .venv/bin/pytest tests/unit -x -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true
