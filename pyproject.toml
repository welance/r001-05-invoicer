[project]
name = "r001-05-invoicer"
version = "0.4.3"
description = "A tiny honest CLI that turns Clockify hours into Qonto client invoices, with pre-mutation previews, typed-confirmation gates, and a Gmail-drafts step that never sends directly."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "welance", email = "hello@welance.com" },
]
keywords = [
    "invoicing",
    "clockify",
    "qonto",
    "cli",
    "agency",
    "time-tracking",
    "e-invoicing",
    "sdi",
    "italy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.24.1",
    "httpx>=0.28.1",
    "pyyaml>=6",
    "python-dotenv>=1",
    "anthropic>=0.40",
    "questionary>=2",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.3.1",
    "google-api-python-client>=2.194.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pre-commit>=4.5.1",
]

[project.urls]
Homepage = "https://github.com/welance/r001-05-invoicer"
Repository = "https://github.com/welance/r001-05-invoicer"
Issues = "https://github.com/welance/r001-05-invoicer/issues"
Changelog = "https://github.com/welance/r001-05-invoicer/blob/main/CHANGELOG.md"

[project.scripts]
invoicer = "invoicer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments (typer uses this heavily)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
