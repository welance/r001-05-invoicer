[project]
name = "invoicer"
version = "0.1.0"
description = "A tiny honest CLI that turns Clockify hours into Qonto client invoices, with pre-mutation previews, typed-confirmation gates, and a Gmail-drafts step that never sends directly."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "welance", email = "hello@welance.com" },
]
keywords = [
    "invoicing",
    "clockify",
    "qonto",
    "cli",
    "agency",
    "time-tracking",
    "e-invoicing",
    "sdi",
    "italy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1",
    "anthropic>=0.40",
    "questionary>=2",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
]

[project.urls]
Homepage = "https://github.com/welance/invoicer"
Repository = "https://github.com/welance/invoicer"
Issues = "https://github.com/welance/invoicer/issues"

[project.scripts]
invoicer = "invoicer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicer"]
